<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="1;url={{ url_for('donate') }}">
    <title>Перенаправление...</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f7ff;
            margin: 0;
        }
        .message {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #4a6eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="message">
        <h2>⏳ Скачивание началось</h2>
        <div class="spinner"></div>
        <p>Сейчас вы будете перенаправлены на страницу поддержки проекта...</p>
        <p><small>Если скачивание не началось, <a href="{{ download_url }}" target="_blank">нажмите здесь</a>.</small></p>
    </div>

    <script>
        // Открываем скачивание в новой вкладке (или в том же окне, если угодно)
        window.open("{{ download_url }}", "_blank");
        // Meta refresh уже сделает редирект на /donate через 1 секунду
    </script>
</body>
</html>
